<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Direçoes e alinhamentos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h2>Flebox - Direções e alinhamentos</h2>
    <p>Linha ao centro:</p>
    <div class="conteiner row-center">
        <div class="card">A</div>
        <div class="card">B</div>
        <div class="card">C</div>

    </div>
<p>Coluna á esquerda</p>
    <div class="conteiner column-left">
        <div class="card">1</div>
        <div class="card">2</div>
        <div class="card">3</div>

    </div>
    <p>Linha espaçada (space-between)</p>
    <div class="conteiner row-space-between">
        <div class="card">4</div>
        <div class="card">5</div>
        <div class="card">6</div>

    </div>

    

    </div>

    <p>Linha com espaço em volta (space-around)</p>
    <div class="conteiner row-space-around">
        <div class="card">D</div>
        <div class="card">E</div>
        <div class="card">F</div>

    </div>
    <p>Quebra de linha (flex-wrap)</p>
    <div class="conteiner flex-wrap">
        <div class="card cardMaior">7</div>
        <div class="card cardMaior">8</div>
        <div class="card cardMaior">9</div>
        <div class="card cardMaior">10</div>
        <div class="card cardMaior">11</div>
        <div class="card cardMaior">12</div>
        <div class="card cardMaior">13</div>
        <div class="card cardMaior">14</div>
    </div>

    <p>Aula</p>
    <div class="conteiner row-center">
        <div class="card">12</div>
        <div class="card">13</div>
        <div class="card">14</div>
    </div>
</body>
</html>
