<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Botão Dropdown com Bootstrap</title>
     <!-- Importação do  CSS do Bootstrap -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"/>
</head>
<body>
    <h1>Botão dropdown com Bootstrap</h1> 
    <!-- dropdown, droppend, dropstart, dropup -->
<div class="dropdown"> 
    <!-- Botão que acima o menu -->
    <button class="btn btn-primary dropdown-toggle" data-bs-toggle="dropdown">Menu</button>
<!-- opções do menu -->
<div class="dropdown-menu">
<h2 class="dropdown-header">Produtos</h2>
<a href="#" class="dropdown-item">Computadores</a>
<a href="#" class="dropdown-item">Celulares</a>
<hr class="dropdown">
<h2 class="dropdown-header">Serviços</h2>
<a href="#" class="dropdown-item">Desenvolvimento web</a>
<a href="#" class="dropdown-item">Desenvolvimento de aplicativos móveis</a>
</div>
</div>


    <!-- Imprtação Do javascript do Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-w76AqPfDkMBDXo30jS1Sgez6pr3x5MlQ1ZAGC+nuZB+EYdgRZgiwxhTBTkF7CXvN"
            crossorigin="anonymous"></script>
</body>
</html>
