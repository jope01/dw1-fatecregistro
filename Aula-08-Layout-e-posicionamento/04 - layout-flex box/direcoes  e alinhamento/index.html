<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Direçôes e alinhamento</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <h2>Flexbox - Direçôes e alinhamentos.</h2>

    <p>Linhas ao centro:</p>
    <div class="container row-center">
        <div class="card">A</div>
        <div class="card">B</div>
        <div class="card">C</div>
    </div>

    <p>Coluna a esquerda</p>
    <div class="container column-left">
        <div class="card">1</div>
        <div class="card">2</div>
        <div class="card">3</div>
    </div>

    <p>Linha espaçada (space-between)</p>
    <div class="container row-space-between">
        <div class="card">4</div>
        <div class="card">5</div>
        <div class="card">6</div>
    </div>

    <p>Linha com espaço em volta (Space-around)</p>
    <div class="container row-space-around">
        <div class="card">D</div>
        <div class="card">E</div>
        <div class="card">F</div>
    </div>

    <p>Quebra de linha (flex-wrap)</p>
    <div class="container flex-wrap">
        <div class="card">7</div>
        <div class="card">8</div>
        <div class="card">9</div>
    </div>

    <p>Linha acima e a esquerda</p>
    <div class="container row-left-start">
        <div class="card">G</div>
        <div class="card">H</div>
        <div class="card">I</div>
    </div>

    
    <p>Linha abaixo e a esquerda</p>
    <div class="container row-left-end">
        <div class="card">J</div>
        <div class="card">K</div>
        <div class="card">L</div>
    </div>
</body>
</html>
