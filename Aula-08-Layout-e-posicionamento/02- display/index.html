<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Exemplos de Display</h1>
    <p>Display: block,inline,inline-block</p>

    <h2>Display: block</h2>
    <div class="bloco">bloco 1</div>
    <div class="bloco">bloco 2</div>

    <h2>Display: inline</h2>
    <div class="linha">linha 1</div>
    <div class="linha">linha 2</div>

    <h2>Display: inline-block</h2>
    <div class="card1 linha-block">card 01</div>
    <div class="card2 linha-block">card 02</div>
    
</body>
</html>
